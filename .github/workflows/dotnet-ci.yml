name: DTO Naming Validation

on:
  push:
    branches: [ '**' ]
    paths:
      - 'Dtos/**/*.cs'
      - '.github/workflows/dto-validation.yml'
  pull_request:
    paths:
      - 'Dtos/**/*.cs'

jobs:
  validate:
    name: 驗證 DTO 命名
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      
    - name: 🔍 檢查 DTO 命名規範
      shell: pwsh
      run: |
        $errors = @()
        
        Get-ChildItem -Path "Dtos/*.cs" -File | ForEach-Object {
            $content = Get-Content $_.FullName -Raw
            
            if ($content -match 'public\s+class\s+(\w+)') {
                $className = $Matches[1]
                
                if ($className -notmatch 'DTO$') {
                    $errors += @{
                        File = $_.Name
                        Class = $className
                        Expected = ($className -replace 'DT$', 'DTO') + $(if ($className -notmatch 'DT$') { 'DTO' })
                    }
                }
            }
        }
        
        if ($errors) {
            Write-Host "::error::發現 DTO 命名違規"
            $errors | ForEach-Object { 
                Write-Host "::error file=$($_.File)::類別 '$($_.Class)' 應該命名為 '$($_.Expected)'"
            }
            exit 1
        }
        
        Write-Host "::notice::✅ 所有 DTO 命名符合規範"
