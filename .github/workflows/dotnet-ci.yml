name: Code Quality & Naming Validation

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: 
      - 'dev'

jobs:
  validate:
    name: 命名與檔案規範檢查
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      
    - name: 🔍 執行類別與檔案命名檢查
      shell: pwsh
      run: |
        $errors = @()
        
        # 定義規則清單：資料夾名稱 => 必須的結尾
        $rules = @{
            "Dtos"        = "DTO"
            "Controllers" = "Controller"
            "Middlewares" = "Middleware"
            "Services"    = "Service"
        }
        
        foreach ($folder in $rules.Keys) {
            $requiredSuffix = $rules[$folder]
            
            # 尋找目標資料夾下的所有 .cs 檔案
            $files = Get-ChildItem -Filter "*.cs" -Recurse | Where-Object { $_.FullName -match "[\\/]$folder[\\/]" }
            
            foreach ($file in $files) {
                # 1. 檢查「檔案名稱」是否以正確後綴結尾 (BaseName 不含副檔名)
                if ($file.BaseName -cnotmatch "$requiredSuffix$") {
                    $errors += @{
                        File     = $file.FullName
                        Target   = "檔案名稱 '$($file.Name)'"
                        Expected = "$requiredSuffix.cs"
                    }
                }

                # 2. 檢查「類別名稱」
                $content = Get-Content $file.FullName -Raw
                if ($content -match 'public\s+class\s+(\w+)') {
                    $className = $Matches[1]
                    
                    if ($className -cnotmatch "$requiredSuffix$") {
                        $errors += @{
                            File     = $file.FullName
                            Target   = "類別名稱 '$className'"
                            Expected = $requiredSuffix
                        }
                    }

                    # 3. 檢查「檔案名」與「類別名」是否一致
                    if ($file.BaseName -ne $className) {
                        $errors += @{
                            File     = $file.FullName
                            Target   = "檔案與類別不匹配"
                            Expected = "檔案名 '$($file.BaseName)' 必須與類別名 '$className' 相同"
                        }
                    }
                }
            }
        }
        
        if ($errors) {
            Write-Host "::error::❌ 命名規範檢查失敗！"
            foreach ($err in $errors) {
                Write-Host "::error file=$($err.File)::[$($err.Target)] 不合規。預期應為: $($err.Expected)"
            }
            exit 1
        }
        
        Write-Host "::notice::✅ 所有檔案與類別命名均符合規範。"
